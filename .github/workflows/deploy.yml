name: Deploy WordPress

on:
  push:
    branches:
      - main

concurrency:
  group: wordpress-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Create deployment package
      - name: Create deployment package
        run: |
          zip -r wordpress.zip . \
            -x ".gitignore/*" \
            -x ".github/*"

      # 3. Copy package to EC2
      - name: Copy package to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "wordpress.zip"
          target: "/tmp"
      
      # 4. Deploy on EC2 and restart services 
      - name: Deploying on EC2 and Restarting Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo unzip -o /tmp/wordpress.zip -d /var/www/wordpress
            sudo systemctl reload nginx
            sudo systemctl restart php8.5-fpm
